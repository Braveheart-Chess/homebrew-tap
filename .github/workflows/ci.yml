name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Dependabot's commit messages carry a capitalised subject and a release
    # notes body, which this repo's one-line rule rejects. Its PRs are squash
    # merged under a lowercase Conventional Commit title instead, so the
    # commit that lands on main still conforms. A skipped job satisfies the
    # required status check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit in the PR range is checked, so rebase merges land
          # only one-line Conventional Commits on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in base..head
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, so it must be a
      # valid Conventional Commit too.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            ci
            build
            perf
            style
            test
            revert
          requireScope: false

  formula:
    name: Formula (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS arm64
          - os: macos-26-intel
            platform: macOS Intel
          - os: ubuntu-latest
            platform: Linux x86-64
          # No engine binary for Linux on ARM: the formula builds from source.
          - os: ubuntu-24.04-arm
            platform: Linux ARM
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      # Installs Homebrew, taps this checkout as braveheart-chess/tap, and
      # trusts it.
      - uses: Homebrew/actions/setup-homebrew@2026.11.14.1
      # The README's install command.
      - name: Install
        run: brew install --formula braveheart-chess/tap/braveheart
      - name: Test (version, perft 4, a UCI search)
        run: brew test --verbose braveheart-chess/tap/braveheart
      - name: Linkage
        run: brew linkage --test braveheart-chess/tap/braveheart
      - name: Audit
        run: brew audit --strict --online --formula braveheart-chess/tap/braveheart

  style:
    name: Formula style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.11.14.1
      - name: Style (RuboCop, Homebrew's rules)
        run: brew style --formula braveheart-chess/tap/braveheart
      # Every platform must load, including those no runner tests.
      - name: Load the formula on every OS and architecture
        run: brew readall --os=all --arch=all braveheart-chess/tap
